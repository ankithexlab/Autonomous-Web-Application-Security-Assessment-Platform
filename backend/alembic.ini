# A generic, single database configuration.

[alembic]
# Path to migration scripts (relative to this file's location)
script_location = alembic

# Template for new migration file names
# %(rev)s  = revision id
# %(slug)s = description slug
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with the project root so `app` package can be imported
# without installing the package. Adjust if your project layout differs.
prepend_sys_path = .

# Timezone for revision file timestamps
timezone = UTC

# Max line length used in migration files
output_encoding = utf-8


# ── Database URL ─────────────────────────────────────────────────
# Leave sqlalchemy.url blank here — env.py reads it from Settings
# so the same .env drives both the application and migrations.
sqlalchemy.url =


# ── Logging ──────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
